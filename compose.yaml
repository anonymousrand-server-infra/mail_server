  mail_server_tachyon:
    container_name: mail_server_tachyon
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    image: ghcr.io/kimusan/tachyon:latest
    restart: unless-stopped
    # currently root since tachyon seems to want to create a bunch of dirs under `/` like `/usr/`
    user: ${DOCKER_ROOT_USER:?}
    # i am not aware of a way to make this listen on a unix socket instead :(
    ports:
      - "${TACHYON_PORT:?}:8888"
    volumes:
      # container-generated data, including config from web ui
      - type: volume
        source: mail_server_tachyon_var
        target: /var/lib/tachyon/
    healthcheck:
      #test: ["CMD", "curl", "-I", "--unix-socket", "${TACHYON_SCKT:?}", "http://localhost/"]
      test: ["CMD", "curl", "-I", "http://localhost:${TACHYON_PORT:?}"]
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      nginx:
        condition: service_healthy
      iocaine:
        condition: service_started
      mail_server_anubis:
        condition: service_healthy

volumes:
  mail_server_tachyon_var:
