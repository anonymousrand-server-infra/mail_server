include:
  - ${PATH_TO_ROOT_DOCKER_PROJ:?}/${PATH_FROM_ROOT_TO_NGINX:?}/compose.yaml
  - ${PATH_TO_ROOT_DOCKER_PROJ:?}/${PATH_FROM_ROOT_TO_IOCAINE:?}/compose.yaml
  - ./deployment/anubis/compose.yaml

services:
  mail_server:
    container_name: mail_server
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    # provide the fqdn of your mail server here (your dns mx record should point to this value)
    hostname: mail.memi.ng
    restart: unless-stopped
    user: ${DOCKER_ROOT_USER:?}
    ports:
      - "25:25"    # smtp  (explicit tls => starttls, NO auth; use port 465/587 for auth)
      - "143:143"  # imap4 (explicit tls => starttls)
      - "465:465"  # esmtp (implicit tls)
      - "587:587"  # esmtp (explicit tls => starttls)
      - "993:993"  # imap4 (implicit tls)
    volumes:
      - type: bind
        source: ./docker-data/dms/mail-data/
        target: /var/mail/
      - type: bind
        source: ./docker-data/dms/mail-state/
        target: /var/mail-state/
      - type: bind
        source: ./docker-data/dms/mail-logs/
        target: /var/log/mail/
      - type: bind
        source: ./docker-data/dms/config/
        target: /tmp/docker-mailserver/
      - type: bind
        source: /etc/localtime
        target: /etc/localtime
        read_only: true
      - type: bind
        source: /etc/letsencrypt
        target: /etc/letsencrypt
    env_file: mailserver.env
    # uncomment if using `ENABLE_FAIL2BAN=1`:
    # cap_add:
    #   - NET_ADMIN
    healthcheck:
      test: "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"
      interval: 1m
      timeout: 3s
      retries: 3
      start_period: 30s

  #rainloop:
  #  container_name: rainloop
